# People in the group. The Group page builds itself from this file.
#
# To add someone, copy the example under "members", remove the leading "# ",
# and fill it in. Put their photo in assets/img/people/ (square crop works best).
# role must be one of: postdoc, grad, undergrad, staff
# If a photo is missing, the page shows their initials instead.
# When someone leaves, move their entry to "alumni" and add "now:" (where they went).

pi:
  name: Jimmy Atterholt
  title: Assistant Professor of Geosciences
  photo: /assets/img/web/atterholt.jpg
  email: atterholt@arizona.edu
  cv: /assets/img/Atterholt_CV_2026.pdf
  linkedin: https://www.linkedin.com/in/atterholt/
  bio: >-
    Jimmy Atterholt is an observational geophysicist and Assistant Professor of Geosciences at
    the University of Arizona. His research combines fiber-optic sensing with applied mathematics
    to study fault zones, crustal structure, and earthquake physics, and to monitor geohazards.
    Before joining Arizona in 2026, he was a Mendenhall Postdoctoral Fellow at the U.S. Geological
    Survey. Outside of research he can usually be found with his dog or working in his garden.
  education:
    - PhD Geophysics, California Institute of Technology (2024)
    - BS Mathematics and BS Geological Sciences, Indiana University (2019)
  experience:
    - Assistant Professor, University of Arizona (2026-present)
    - Mendenhall Postdoctoral Fellow, U.S. Geological Survey (2024-2026)
    - Graduate Student Researcher, Caltech Seismological Laboratory (2019-2024)

